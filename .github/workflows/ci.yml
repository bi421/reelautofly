name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reelautofly
          POSTGRES_PASSWORD: password
          POSTGRES_DB: reelautofly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelautofly -d reelautofly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://reelautofly:password@localhost:5432/reelautofly
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:3000
      ENCRYPTION_KEY_32_BYTES: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      META_GRAPH_API_VERSION: v26.0
      META_APP_ID: test
      META_APP_SECRET: test
      META_OAUTH_REDIRECT_URI: http://localhost:3000/api/auth/meta/callback
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
      PUBLIC_BASE_URL: http://localhost:3000
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET: test
      R2_PUBLIC_BASE_URL: https://example.r2.cloudflarestorage.com/test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm build
